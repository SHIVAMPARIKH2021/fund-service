spring:
  application:
    name: fund-service

  datasource:
    url: default
    username: default
    password: default

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: false

fund:
  series:
    format: "^S[0-9]{9}$"